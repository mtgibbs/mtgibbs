name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run on master/main push
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: mtgibbs
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          
          # Plugins
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          
          # Achievements plugin (to show off activity/milestones)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          
          # Isometric calendar (great for showing "craftsman" consistency)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Traffic (if you want to see views on this repo)
          plugin_traffic: yes
